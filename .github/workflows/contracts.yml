name: contracts

on:
  push:
    branches: ["**"]
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]

env:
  # Pinned, not `stable`. `deny = "warnings"` makes forge's linter part of the build contract, and
  # the lint rule set changes between releases -- forge 1.7.1 added `block-timestamp`, which turned
  # an unchanged repository red on a floating toolchain. Gate check A7: the toolchain is pinned for
  # the same reason solc is. Upgrading is a deliberate commit that re-runs the gate.
  FOUNDRY_VERSION: v1.7.1

jobs:
  gate:
    name: build + test (self-audit gate v2, checks A2 / fuzz)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Record toolchain versions
        run: |
          forge --version
          echo "solc pinned in foundry.toml: $(grep solc_version foundry.toml)"

      # Gate check A2: warnings are build failures, not advisories.
      # `deny = "warnings"` in foundry.toml covers both solc and forge lint.
      - name: Build (zero warnings)
        run: forge build

      - name: Check formatting
        run: forge fmt --check

      # Fuzz properties run 10,000 cases each; invariants run 256 x 128.
      # Never run this job under FOUNDRY_PROFILE=lite.
      - name: Test
        run: forge test -vvv
