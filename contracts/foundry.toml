[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# I-P1 / gate v2: the compiler is pinned, never floating.
solc_version = "0.8.24"
# ADR-0001: shanghai, not cancun. Keeps MCOPY out of the bytecode so the same
# artifacts stay deployable on Base, Linea and BNB (phase 2) without a recompile.
evm_version = "shanghai"

optimizer = true
optimizer_runs = 200
via_ir = false

# Gate v2 requires a clean compile. Any warning is a build failure.
# (forge >= 1.3; the old spelling was `deny_warnings = true`.)
deny = "warnings"

[lint]
# `block-timestamp` is excluded, deliberately — deviation DEV-05 in the self-audit gate.
#
# Every `block.timestamp` comparison in this codebase gates a validity window measured in
# minutes to days: attestation validity (5 minutes .. 7 days), the mode de-escalation cooldown
# (6 hours), grant windows (up to 365 days), and the admin handover delay (3 days). Second-level
# proposer or sequencer drift cannot move any of those decisions.
#
# It is excluded at config level rather than with thirteen identical inline suppressions because
# the justification is one argument, not thirteen. The property it protects is kept under review
# by gate check F9 instead: no timestamp-derived window may be shorter than one minute, and
# `HARD_MIN_VALIDITY` enforces that floor on-chain. A future short window is caught by the gate,
# which is where that judgement belongs.
exclude_lints = ["block-timestamp"]

bytecode_hash = "none"
cbor_metadata = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 10_000
max_test_rejects = 500_000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

# Fast loop for local iteration only. Never used for a gate run.
[profile.lite.fuzz]
runs = 256

[profile.lite.invariant]
runs = 16
depth = 32

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 84532}
base = {key = "${ETHERSCAN_API_KEY}", chain = 8453}
